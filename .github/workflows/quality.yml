name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - name: Resumo de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: npx tsx scripts/coverage-summary.ts
      - run: npm run check:links
      - run: npm run check:performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/fastapi-ollama/requirements.lock.txt
      - run: python -m pip install -r examples/fastapi-ollama/requirements.lock.txt
      - run: python -m pytest -q
        working-directory: examples/fastapi-ollama
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 7
