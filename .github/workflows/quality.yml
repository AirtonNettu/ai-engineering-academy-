name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - name: Resumo de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: npx tsx scripts/coverage-summary.ts
      - run: npm run check:links
      - run: npm run check:performance
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/fastapi-ollama/requirements.lock.txt
      - run: python -m pip install -r examples/fastapi-ollama/requirements.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
        working-directory: examples/fastapi-ollama
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatórios e traces de E2E (em falha)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 3
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 7
